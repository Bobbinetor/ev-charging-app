{% extends "base.html" %}
{% block title %}404 - Pagina non trovata{% endblock %}

{% block content %}
<div class="error-container">
    <div class="error-content">
        <h1>404</h1>
        <h2>Pagina non trovata</h2>
        <p>La pagina che stai cercando non esiste o è stata spostata.</p>
        <a href="{{ url_for('main.index') }}" class="btn btn-primary">Torna alla home</a>
    </div>
</div>
{% endblock %}

{% block extra_css %}
<style>
    .error-container {
        text-align: center;
        padding: 100px 0;
    }
    
    .error-content {
        max-width: 500px;
        margin: 0 auto;
    }
    
    .error-content h1 {
        font-size: 8rem;
        color: var(--primary-color);
        margin-bottom: 0;
        line-height: 1;
    }
    
    .error-content h2 {
        font-size: 2rem;
        margin-bottom: 20px;
    }
    
    .error-content p {
        color: var(--light-text);
        margin-bottom: 30px;
    }
</style>
{% endblock %}
